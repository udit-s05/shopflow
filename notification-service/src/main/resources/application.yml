server:
  port: 8085

spring:
  application:
    name: nnotification-service
  kafka:
    bootstrap-servers: localhost:9092
  mail:
    host: localhost
    port: 1025

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always