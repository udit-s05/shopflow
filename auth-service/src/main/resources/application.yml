server:
  port: 8081

spring:
  application:
    name: auth-service
    datasource:
      url: jdbc:postgresql://localhost:5432/authdb
      username: postgres
      password: postgres
    
    jpa:
      hibernate:
        ddl-auto: validate
        open-in-view: false

    flyway:
      enabled: true

    data:
      redis:
        host: localhost
        port: 6379

    kafka:
      boostrap-servers: localhost:9092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always